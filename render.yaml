# Render Blueprint Specification for CrowdVision Platform
# Automatically provisions both the Backend Web Service and Frontend Static Site
version: "1"

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Web Service (FastAPI REST API + WebSocket Engine)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: crowdvision-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Static Site (React 19 + TypeScript + Vite)
  # ─────────────────────────────────────────────────────────────
  - type: static
    name: crowdvision-app
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: crowdvision-api
          property: host
